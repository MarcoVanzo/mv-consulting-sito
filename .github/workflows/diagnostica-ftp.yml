name: Diagnostica FTP

# Utilità di servizio: elenca lo spazio remoto e verifica dove si può scrivere.
# Non modifica il sito (crea e rimuove subito una cartella di prova).
on:
  workflow_dispatch:

jobs:
  diagnostica:
    runs-on: ubuntu-latest
    steps:
      - name: Installa lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Elenca e prova la scrittura
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          conn="set ftp:ssl-allow true; set ssl:verify-certificate no; set cmd:trace off; open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';"

          echo "=================== contenuto della radice ==================="
          lftp -c "$conn cls -l --sort=name ." || true

          echo
          echo "=================== percorso corrente ==================="
          lftp -c "$conn pwd" || true

          echo
          echo "=================== prova di scrittura ==================="
          for d in . ./www ./htdocs ./public_html ./wwwroot ./web; do
            printf '%-16s ' "$d"
            if lftp -c "$conn mkdir -p '$d/_prova_scrittura'" >/dev/null 2>&1; then
              echo "SCRIVIBILE"
              lftp -c "$conn rmdir '$d/_prova_scrittura'" >/dev/null 2>&1 || true
            else
              echo "non scrivibile (o inesistente)"
            fi
          done

          echo
          echo "=================== sottocartelle di primo livello ==================="
          lftp -c "$conn cls -d */" || true

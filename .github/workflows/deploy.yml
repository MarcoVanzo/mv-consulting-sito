name: Deploy su Aruba

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - '.gitignore'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      pulizia_totale:
        description: "Svuota la cartella remota prima di caricare (rimuove i residui WordPress). Usare solo dopo aver fatto il backup."
        type: boolean
        default: false

concurrency:
  group: deploy-produzione
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifica che i secret siano configurati
        run: |
          mancanti=""
          [ -z "${{ secrets.FTP_SERVER }}" ]     && mancanti="$mancanti FTP_SERVER"
          [ -z "${{ secrets.FTP_USERNAME }}" ]   && mancanti="$mancanti FTP_USERNAME"
          [ -z "${{ secrets.FTP_PASSWORD }}" ]   && mancanti="$mancanti FTP_PASSWORD"
          [ -z "${{ secrets.SMTP_UTENTE }}" ]    && mancanti="$mancanti SMTP_UTENTE"
          [ -z "${{ secrets.SMTP_PASSWORD }}" ]  && mancanti="$mancanti SMTP_PASSWORD"
          if [ -n "$mancanti" ]; then
            echo "::error::Secret mancanti:$mancanti — impostarli in Settings > Secrets and variables > Actions, poi rilanciare."
            exit 1
          fi

      # Le credenziali della casella di posta non stanno nel repository, ed è
      # giusto così: si scrivono qui, al momento di pubblicare, leggendole dai
      # secret. Il file finisce sul server insieme al resto e viene riscritto a
      # ogni deploy — il che risolve anche il problema di prima, quando stava
      # solo sul server e una `pulizia_totale` lo portava via lasciando il
      # modulo muto.
      #
      # Il valore passa da un file PHP generato con var_export e non da un
      # `echo`: una password può contenere apici, barre rovesce e dollari, e
      # comporre il file a mano significherebbe romperlo prima o poi.
      - name: Prepara le credenziali della posta
        env:
          SMTP_UTENTE: ${{ secrets.SMTP_UTENTE }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          cat > /tmp/genera-config.php <<'GENERATORE'
          <?php
          $modello = <<<'PHP'
          <?php
          /**
           * Scritto dal deploy a ogni pubblicazione, leggendo i secret del
           * repository. Non si modifica a mano sul server: la prossima
           * pubblicazione lo riscriverebbe. Per cambiare la password si cambia
           * il secret SMTP_PASSWORD.
           */
          declare(strict_types=1);

          return [
              'host'     => 'smtps.aruba.it',
              'porta'    => 465,
              'utente'   => %s,
              'password' => %s,
          ];

          PHP;
          printf($modello, var_export(getenv('SMTP_UTENTE'), true), var_export(getenv('SMTP_PASSWORD'), true));
          GENERATORE

          php /tmp/genera-config.php > config-smtp.php
          php -l config-smtp.php
          # si controlla che il file sia leggibile e completo, senza stamparlo
          php -r '$c = require "config-smtp.php";
                  if (!is_array($c) || ($c["utente"] ?? "") === "" || ($c["password"] ?? "") === "") {
                      fwrite(STDERR, "il file delle credenziali e uscito incompleto\n"); exit(1);
                  }
                  echo "credenziali pronte per ", $c["utente"], "\n";'

      # Si usa lftp e non un'action pronta: il server FTP di Aruba rifiuta i
      # percorsi assoluti che FTP-Deploy-Action usa per creare le sottocartelle
      # ("550 Can't change directory to /assets"). lftp lavora in modo relativo
      # e crea l'albero senza problemi.
      - name: Installa lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Il proxy di Aruba tiene CSS e JS per un anno (.htaccess). Con un
      # indirizzo fisso, una copia sbagliata resta servita per un anno anche
      # se sul server il file è integro: è già successo con uno style.css che
      # il proxy ha letto mentre l'FTP lo stava riscrivendo, memorizzandolo
      # tagliato a metà. Aggiungendo l'impronta del file all'indirizzo, ogni
      # versione ha un URL suo e la cache non può servire quella precedente.
      # Si tocca solo la copia che va sul server: i file del repository
      # restano quelli che si modificano a mano.
      - name: Versiona i riferimenti a CSS e JS
        run: |
          for asset in assets/css/style.css assets/js/main.js; do
            v=$(sha256sum "$asset" | cut -c1-8)
            grep -rl "/$asset" --include='*.html' --include='*.php' . \
              | xargs -r sed -i "s#/$asset\([\"']\)#/$asset?v=$v\1#g"
            echo "/$asset -> ?v=$v"
          done
          grep -ohE '/assets/[^"]+\.(css|js)\?v=[0-9a-f]+' ./*.html | sort -u

      - name: Carica via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          # Cartella pubblica sul server: su questo hosting è la radice della
          # connessione FTP. Se cambiasse, impostare la variabile FTP_DIR.
          FTP_DIR: ${{ vars.FTP_DIR || '/' }}
          PULIZIA: ${{ inputs.pulizia_totale == true && '--delete' || '' }}
        run: |
          [ -n "$PULIZIA" ] && echo "::warning::pulizia totale attiva: i file remoti non presenti in questo repository verranno rimossi"

          # L'FTP di Aruba ogni tanto chiude il canale dati a metà: il file
          # arriva tagliato (index.html si è già fermato due volte a 16384
          # byte esatti) ma il server risponde comunque "226 transfer
          # complete" e lftp non se ne accorge. Si carica in seriale — il
          # sito sta in 64 KB, il parallelismo non fa guadagnare niente — e
          # poi si ripassa con --ignore-time, che confronta le dimensioni
          # invece delle date: chi è tagliato risulta diverso e riparte.
          #
          # Quel 16384 non è un numero a caso: è la dimensione massima di un
          # record TLS. Il canale dati cifrato di Aruba si chiude dopo il
          # primo record, così ogni file più grande di 16 KB arriva tagliato
          # lì — e tre deploy di fila si sono fermati proprio per questo,
          # lasciando online una og.jpg di 16384 byte su 64623. Si cifra
          # quindi il solo canale di controllo, quello su cui viaggiano
          # utente e password: i dati sono file pubblici del sito, che il
          # visitatore scaricherà comunque in chiaro dal browser.
          mirror() {
            lftp -c "
              set cmd:trace off;
              set ftp:ssl-allow true;
              set ftp:ssl-protect-data false;
              set ssl:verify-certificate no;
              set net:max-retries 3;
              set net:timeout 20;
              set xfer:clobber on;
              open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
              mirror --reverse --parallel=1 $* $PULIZIA \
                --exclude-glob .git* \
                --exclude .github/ \
                --exclude .claude/ \
                --exclude .anteprima/ \
                --exclude tools/ \
                --exclude README.md \
                --exclude CLAUDE.md \
                --exclude-glob .DS_Store \
                ./ '$FTP_DIR'
            "
          }

          mirror --verbose

          # Ogni ripassata ricarica i file di dimensione diversa e dice quali:
          # quando non trasferisce più niente, il server ha tutto per intero.
          completo=no
          for tentativo in 1 2 3; do
            esito=$(mirror --ignore-time --verbose)
            echo "$esito"
            if ! echo "$esito" | grep -q 'Transferring file'; then
              completo=sì
              break
            fi
            echo "::warning::giro $tentativo: alcuni file erano arrivati incompleti e sono stati ricaricati"
          done
          [ "$completo" = sì ] || { echo "::error::dopo tre tentativi il server continua a ricevere file incompleti"; exit 1; }

      # Il vecchio sito WordPress ha lasciato sul server le cartelle delle sue
      # pagine. Dove dentro c'è un index, quello vince sui redirect di
      # .htaccess: il 6 agosto 2026 /chi-siamo/ e /contatti/ rispondevano 200
      # servendo i testi del sito precedente, indicizzabili come pagine vive.
      # Si rimuovono per nome, non a tappeto: la pulizia totale cancella anche
      # tutto ciò che sul server non arriva da questo repository.
      #
      # La stessa lista serve a un secondo scopo. Il caricamento non cancella
      # mai — è la sua qualità: un file messo a mano sul server, come quello
      # con la password della posta, sopravvive ai deploy. Il rovescio è che
      # togliere un file dal repository non lo toglie da online. Chi elimina un
      # file già pubblicato ne scrive qui il nome, e sparisce alla pubblicazione
      # successiva. `diagnostica-smtp.php` è il primo caso: una sonda temporanea
      # per capire perché mail() restava appesa.
      - name: Rimuove le pagine rimaste dal vecchio sito
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || '/' }}
          RESIDUI: chi-siamo contatti servizi partner privacy-policy cookie-policy privacy diagnostica-smtp.php
        run: |
          for cartella in $RESIDUI; do
            echo "--- $cartella"
            # Se un giorno una di queste cartelle tornasse a esistere davvero
            # nel repository, il deploy la caricherebbe e questo passo la
            # cancellerebbe subito dopo: si tocca solo ciò che qui non c'è.
            if [ -e "$cartella" ]; then echo "  (esiste nel repository, non si tocca)"; continue; fi
            lftp -c "
              set cmd:trace off;
              set ftp:ssl-allow true;
              set ftp:ssl-protect-data false;
              set ssl:verify-certificate no;
              set net:max-retries 3;
              set net:timeout 20;
              open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
              cd '$FTP_DIR';
              find '$cartella';
              rm -r -f '$cartella';
            " || echo "  (non presente)"
          done

      - name: Controllo del sito pubblicato
        run: |
          sleep 5

          # Le pagine del vecchio sito devono rispondere con il redirect di
          # .htaccess, non con il loro contenuto. Si interroga l'origine con un
          # parametro: senza, si leggerebbe la cache di Aruba, che queste
          # pagine le tiene per trenta giorni.
          for p in /chi-siamo/ /contatti/ /servizi/ /partner/ /privacy-policy/; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://www.mv-consulting.it$p?deploy=${GITHUB_RUN_ID}")
            echo "$p -> $c"
            if [ "$c" = "200" ]; then
              echo "::error::$p serve ancora una pagina del vecchio sito"
              exit 1
            fi
            # Sul server non c'è più, ma chi arriva senza parametro può
            # continuare a riceverla dalla cache fino alla scadenza. Si
            # segnala e basta: svuotare la cache dal deploy non si può.
            if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://www.mv-consulting.it$p")" = "200" ]; then
              echo "::warning::$p è stata rimossa dal server ma la cache di Aruba la serve ancora: svuotarla da Pannello Aruba > Velocità > Caching"
            fi
          done
          # Il proxy di Aruba tiene le pagine in cache: si interroga l'origine
          # con un parametro casuale, altrimenti si leggerebbe la copia vecchia
          # e il controllo fallirebbe pur essendo andato tutto a buon fine.
          url="https://www.mv-consulting.it/?deploy=${GITHUB_RUN_ID}"
          codice=$(curl -s -o /tmp/home.html -w '%{http_code}' "$url")
          echo "HTTP $codice"
          [ "$codice" = "200" ] || { echo "::error::la home risponde $codice"; exit 1; }
          grep -q "Non esistono cose facili" /tmp/home.html \
            || { echo "::error::la home risponde ma non serve il sito nuovo"; exit 1; }

          for p in /assets/css/style.css /assets/js/main.js /privacy-policy.html; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://www.mv-consulting.it$p")
            echo "$p -> $c"
            [ "$c" = "200" ] || { echo "::error::$p risponde $c"; exit 1; }
          done

          # Il 200 dice che il file esiste, non che è quello appena caricato: se
          # l'FTP ha saltato un file o il proxy serve una copia vecchia, la
          # risposta è 200 lo stesso e il deploy sembrerebbe riuscito. Si
          # confrontano i byte, con qualche tentativo perché la pubblicazione
          # non è istantanea. Il parametro con lo sha rende l'indirizzo unico a
          # ogni deploy, così si legge l'originale e non la cache.
          confronta() {
            atteso=$(sha256sum "$1" | cut -d' ' -f1)
            for tentativo in 1 2 3 4 5; do
              servito=$(curl -s --max-time 30 "https://www.mv-consulting.it/$1?v=${GITHUB_SHA}" | sha256sum | cut -d' ' -f1)
              if [ "$servito" = "$atteso" ]; then echo "$1 -> identico"; return 0; fi
              sleep 10
            done
            echo "::error::$1 online non corrisponde alla versione pubblicata (atteso ${atteso:0:12}, servito ${servito:0:12})"
            return 1
          }
          # Le immagini erano fuori da questo confronto, e per tre deploy di
          # fila nessuno si è accorto che og.jpg online era ferma a 16384
          # byte: le anteprime su WhatsApp e LinkedIn uscivano tagliate a
          # metà. Sono file grandi quanto basta a incappare nel troncamento,
          # quindi si controllano anche loro.
          esito=0
          for f in index.html privacy-policy.html 404.html assets/css/style.css assets/js/main.js assets/img/*; do
            confronta "$f" || esito=1
          done
          [ "$esito" -eq 0 ] || exit 1

          # Il confronto qui sopra usa un parametro e quindi raggiunge
          # l'origine: dice che il file è arrivato intero sul server, non che
          # il visitatore lo riceve intero. Si rifà allora il giro come lo fa
          # un browser — si legge la home e si scarica ogni foglio di stile e
          # script all'indirizzo esatto che vi compare, quello versionato —
          # perché è lì che la cache di Aruba può servire una copia sbagliata.
          esito_cache=0
          for u in $(grep -ohE '/assets/[^"]+\.(css|js)(\?[^"]*)?' /tmp/home.html | sort -u); do
            atteso=$(wc -c < ".${u%%\?*}")
            servito=$(curl -s --max-time 30 "https://www.mv-consulting.it$u" | wc -c)
            echo "$u -> $servito byte (attesi $atteso)"
            [ "$servito" = "$atteso" ] || { echo "::error::$u arriva al visitatore in versione sbagliata ($servito byte invece di $atteso): svuotare la cache da Pannello Aruba > Velocità > Caching"; esito_cache=1; }
          done
          [ "$esito_cache" -eq 0 ] || exit 1

          # Stato della cache pubblica: informativo, non fa fallire il deploy.
          cache=$(curl -sI https://www.mv-consulting.it/ | grep -i '^x-aruba-cache' | tr -d '\r')
          echo "Cache del proxy: ${cache:-non dichiarata}"
          if curl -s https://www.mv-consulting.it/ | grep -q "Non esistono cose facili"; then
            echo "Sito nuovo online e servito anche dalla cache."
          else
            echo "::warning::il sito nuovo è pubblicato, ma il proxy di Aruba serve ancora la versione in cache. Svuotare la cache da Pannello > Velocità > Caching."
          fi

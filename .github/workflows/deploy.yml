name: Deploy su Aruba

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - '.gitignore'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      pulizia_totale:
        description: "Svuota la cartella remota prima di caricare (rimuove i residui WordPress). Usare solo dopo aver fatto il backup."
        type: boolean
        default: false

concurrency:
  group: deploy-produzione
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifica che i secret siano configurati
        run: |
          mancanti=""
          [ -z "${{ secrets.FTP_SERVER }}" ]   && mancanti="$mancanti FTP_SERVER"
          [ -z "${{ secrets.FTP_USERNAME }}" ] && mancanti="$mancanti FTP_USERNAME"
          [ -z "${{ secrets.FTP_PASSWORD }}" ] && mancanti="$mancanti FTP_PASSWORD"
          if [ -n "$mancanti" ]; then
            echo "::error::Secret mancanti:$mancanti — impostarli in Settings > Secrets and variables > Actions, poi rilanciare."
            exit 1
          fi

      # Si usa lftp e non un'action pronta: il server FTP di Aruba rifiuta i
      # percorsi assoluti che FTP-Deploy-Action usa per creare le sottocartelle
      # ("550 Can't change directory to /assets"). lftp lavora in modo relativo
      # e crea l'albero senza problemi.
      - name: Installa lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Carica via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          # Cartella pubblica sul server: su questo hosting è la radice della
          # connessione FTP. Se cambiasse, impostare la variabile FTP_DIR.
          FTP_DIR: ${{ vars.FTP_DIR || '/' }}
          PULIZIA: ${{ inputs.pulizia_totale == true && '--delete' || '' }}
        run: |
          [ -n "$PULIZIA" ] && echo "::warning::pulizia totale attiva: i file remoti non presenti in questo repository verranno rimossi"

          # L'FTP di Aruba ogni tanto chiude il canale dati a metà: il file
          # arriva tagliato (index.html si è già fermato due volte a 16384
          # byte esatti) ma il server risponde comunque "226 transfer
          # complete" e lftp non se ne accorge. Si carica in seriale — il
          # sito sta in 64 KB, il parallelismo non fa guadagnare niente — e
          # poi si ripassa con --ignore-time, che confronta le dimensioni
          # invece delle date: chi è tagliato risulta diverso e riparte.
          mirror() {
            lftp -c "
              set cmd:trace off;
              set ftp:ssl-allow true;
              set ssl:verify-certificate no;
              set net:max-retries 3;
              set net:timeout 20;
              set xfer:clobber on;
              open -u '$FTP_USER','$FTP_PASS' '$FTP_HOST';
              mirror --reverse --parallel=1 $* $PULIZIA \
                --exclude-glob .git* \
                --exclude .github/ \
                --exclude .claude/ \
                --exclude .anteprima/ \
                --exclude README.md \
                --exclude CLAUDE.md \
                --exclude-glob .DS_Store \
                ./ '$FTP_DIR'
            "
          }

          mirror --verbose

          # Ogni ripassata ricarica i file di dimensione diversa e dice quali:
          # quando non trasferisce più niente, il server ha tutto per intero.
          completo=no
          for tentativo in 1 2 3; do
            esito=$(mirror --ignore-time --verbose)
            echo "$esito"
            if ! echo "$esito" | grep -q 'Transferring file'; then
              completo=sì
              break
            fi
            echo "::warning::giro $tentativo: alcuni file erano arrivati incompleti e sono stati ricaricati"
          done
          [ "$completo" = sì ] || { echo "::error::dopo tre tentativi il server continua a ricevere file incompleti"; exit 1; }

      - name: Controllo del sito pubblicato
        run: |
          sleep 5
          # Il proxy di Aruba tiene le pagine in cache: si interroga l'origine
          # con un parametro casuale, altrimenti si leggerebbe la copia vecchia
          # e il controllo fallirebbe pur essendo andato tutto a buon fine.
          url="https://www.mv-consulting.it/?deploy=${GITHUB_RUN_ID}"
          codice=$(curl -s -o /tmp/home.html -w '%{http_code}' "$url")
          echo "HTTP $codice"
          [ "$codice" = "200" ] || { echo "::error::la home risponde $codice"; exit 1; }
          grep -q "Non esistono cose facili" /tmp/home.html \
            || { echo "::error::la home risponde ma non serve il sito nuovo"; exit 1; }

          for p in /assets/css/style.css /assets/js/main.js /privacy-policy.html; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://www.mv-consulting.it$p")
            echo "$p -> $c"
            [ "$c" = "200" ] || { echo "::error::$p risponde $c"; exit 1; }
          done

          # Il 200 dice che il file esiste, non che è quello appena caricato: se
          # l'FTP ha saltato un file o il proxy serve una copia vecchia, la
          # risposta è 200 lo stesso e il deploy sembrerebbe riuscito. Si
          # confrontano i byte, con qualche tentativo perché la pubblicazione
          # non è istantanea. Il parametro con lo sha rende l'indirizzo unico a
          # ogni deploy, così si legge l'originale e non la cache.
          confronta() {
            atteso=$(sha256sum "$1" | cut -d' ' -f1)
            for tentativo in 1 2 3 4 5; do
              servito=$(curl -s --max-time 30 "https://www.mv-consulting.it/$1?v=${GITHUB_SHA}" | sha256sum | cut -d' ' -f1)
              if [ "$servito" = "$atteso" ]; then echo "$1 -> identico"; return 0; fi
              sleep 10
            done
            echo "::error::$1 online non corrisponde alla versione pubblicata (atteso ${atteso:0:12}, servito ${servito:0:12})"
            return 1
          }
          esito=0
          for f in index.html privacy-policy.html 404.html assets/css/style.css assets/js/main.js; do
            confronta "$f" || esito=1
          done
          [ "$esito" -eq 0 ] || exit 1

          # Stato della cache pubblica: informativo, non fa fallire il deploy.
          cache=$(curl -sI https://www.mv-consulting.it/ | grep -i '^x-aruba-cache' | tr -d '\r')
          echo "Cache del proxy: ${cache:-non dichiarata}"
          if curl -s https://www.mv-consulting.it/ | grep -q "Non esistono cose facili"; then
            echo "Sito nuovo online e servito anche dalla cache."
          else
            echo "::warning::il sito nuovo è pubblicato, ma il proxy di Aruba serve ancora la versione in cache. Svuotare la cache da Pannello > Velocità > Caching."
          fi
